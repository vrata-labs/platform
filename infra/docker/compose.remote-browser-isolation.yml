# Start this profile together with the trusted executor's explicit opt-in.
x-isolation: &isolation
  image: ${REMOTE_BROWSER_IMAGE_REPO:-vrata-remote-browser}:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: apps/remote-browser/Dockerfile
  profiles: [public-https-network]
  init: true
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  healthcheck:
    disable: true

x-chromium: &chromium
  <<: *isolation
  network_mode: none
  user: "1001:1001"
  security_opt:
    - no-new-privileges:true
    - seccomp:chromium-seccomp.json
  shm_size: 256m
  pids_limit: 256
  mem_limit: 1g

services:
  public-https-gateway:
    <<: *isolation
    command: [node, apps/remote-browser/dist/public-https-gateway-service.js]
    user: "1000:1001"
    security_opt: [no-new-privileges:true]
    networks: [public-https-egress]
    environment:
      REMOTE_BROWSER_PUBLIC_HTTPS_DENY_CIDRS: ${REMOTE_BROWSER_PUBLIC_HTTPS_DENY_CIDRS:-}
    volumes:
      - public-https-data:/var/lib/vrata-public-https/data
      - public-https-control:/var/lib/vrata-public-https/control
    pids_limit: 128
    mem_limit: 512m

  public-https-chromium:
    <<: *chromium
    command: [node, apps/remote-browser/dist/public-https-worker.js, "91"]
    volumes:
      - public-https-display-91:/tmp/.X11-unix
      - public-https-proxy-91:/var/lib/vrata-public-https/proxy:ro

  public-https-chromium-92:
    <<: *chromium
    command: [node, apps/remote-browser/dist/public-https-worker.js, "92"]
    volumes:
      - public-https-display-92:/tmp/.X11-unix
      - public-https-proxy-92:/var/lib/vrata-public-https/proxy:ro

networks:
  public-https-egress:
    driver: bridge

volumes:
  public-https-control:
  public-https-data:
  public-https-display-91:
  public-https-display-92:
  public-https-proxy-91:
  public-https-proxy-92:
