name: Prepare XR telemetry extraction
on:
  push:
    branches: [preparation/api-decomposition-20260913c]
    paths: [.github/workflows/prepare-xr-telemetry-service.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout preparation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply exact extraction and preserve reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object AGENTS.md)" = 444218fb39af0ca11327fef9638b3373a5787dab
          test "$(git hash-object apps/api/src/index.ts)" = fab7988e383fe140039c45e08634e0945141f941
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil
          path = Path('apps/api/src/index.ts')
          original = path.read_text()
          start = original.index('async function upsertXrTelemetry(')
          end = original.index('const buildManifest = ', start)
          old = original[start:end]
          module = Path('apps/api/src/xr-telemetry-service.ts').read_text()
          nested = module[module.index('  async function upsertXrTelemetry('):module.index('\n\n  return { upsertXrTelemetry, listXrTelemetry };')]
          assert '\n'.join(line[2:] if line.startswith('  ') else line for line in nested.split('\n')) == old.rstrip('\n')
          import_start = original.index('import {\n  appendXrTelemetryRecord,')
          import_end = original.index('\n\n', import_start)
          old_import = original[import_start:import_end]
          new_import = 'import { createXrTelemetryService } from "./xr-telemetry-service.js";\nimport type { XrTelemetryRecord } from "./xr-telemetry-buffer.js";'
          old_map = 'const xrTelemetryByRoom = new Map<string, Map<string, XrTelemetryParticipantBuffer>>();'
          new_service = 'const { upsertXrTelemetry, listXrTelemetry } = createXrTelemetryService(storagePromise);'
          assert ('  ' + old_map) in module
          result = (original[:start] + original[end:]).replace(old_import, new_import).replace(old_map, new_service)
          restored = result.replace(new_import, old_import).replace(new_service, old_map).replace('const buildManifest = ', old + 'const buildManifest = ', 1)
          assert restored == original
          path.write_text(result)
          expected = {
            'index.ts': 'a9b87dd9d426e1982e2c7c6b30aedefbf2fb1dbb2ad38a90cf4795654897a44f',
            'xr-telemetry-service.ts': 'bcac0ce75d53f21a384cfd279dfa0c63011a055b9339b3ed952bda4858b9cd00',
            'xr-telemetry-service.test.ts': '81a96efecc93bf15e568ac974eba9025b289a292d8794578ee2419f91bbd6382'
          }
          frozen = Path(os.environ['RUNNER_TEMP']) / 'reviewed'
          frozen.mkdir()
          lines = []
          for name, digest in expected.items():
            source = Path('apps/api/src') / name
            assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, name
            shutil.copyfile(source, frozen / name)
            lines.append(f'{digest}  {source}')
          (Path(os.environ['RUNNER_TEMP']) / 'reviewed.sha256').write_text('\n'.join(lines) + '\n')
          print('Exact inverse reconstruction and all three source hashes verified; index.ts reduced by 52 lines')
          PY
          git diff --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Telemetry service contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/api/dist/xr-telemetry-service.test.js | tee "$RUNNER_TEMP/xr-telemetry-contracts.log"
      - name: Workspace tests including PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: pnpm test
      - name: Verify tested files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/reviewed.sha256"
      - name: Checkout clean publication base independently of tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vrata-labs/platform
          ref: d7c1c44798a7f88f84952aca3341ea34e3423c65
          path: publication
      - name: Commit and push only the three verified files
        working-directory: publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d7c1c44798a7f88f84952aca3341ea34e3423c65
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d7c1c44798a7f88f84952aca3341ea34e3423c65
          for name in index.ts xr-telemetry-service.ts xr-telemetry-service.test.ts; do
            cp "$RUNNER_TEMP/reviewed/$name" "apps/api/src/$name"
          done
          sha256sum --check "$RUNNER_TEMP/reviewed.sha256"
          git add apps/api/src/index.ts apps/api/src/xr-telemetry-service.ts apps/api/src/xr-telemetry-service.test.ts
          git diff --cached --check
          test "$(git write-tree)" = ae5c31de8e7adb905149b0a6cc02d74f70b464ec
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(api): extract XR telemetry service' -m 'Move the existing upsert/list functions and private live map into an injected-storage service without changing function bodies. Preserve persistence decisions, await and clone timing, failures, live state, history merging, limits and ordering. Add 24 contract tests. Only three code files; preparation workflow excluded.'
          git push origin HEAD:refs/heads/refactor/api-xr-telemetry-service-20260913
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/candidate-source.tgz" HEAD
      - name: Preserve exact candidate source and contract results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xr-telemetry-candidate-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/candidate-source.tgz
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/reviewed.sha256
            ${{ runner.temp }}/xr-telemetry-contracts.log
