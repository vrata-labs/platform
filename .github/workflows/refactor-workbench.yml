name: Refactor workbench

on:
  push:
    branches:
      - chore/refactor-runtime-workbench-20260929

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify-document-extraction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated workbench
        uses: actions/checkout@v4
        with:
          ref: chore/refactor-runtime-workbench-20260929
      - name: Apply exact locally verified extraction
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, subprocess
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          data = b''.join(pathlib.Path(f'.refactor-workbench/part-{i}').read_bytes() for i in range(5))
          assert blob(data) == 'b65f642b3b8fe7766556c4e811b2a4fb1a0f384c'
          payload = json.loads(gzip.decompress(data))
          fixes = {
              'apps/runtime-web/src/testing/document-ui-dom.ts': [
                  ('textContent: string | null = "";', 'textContent = "";')],
              'apps/runtime-web/src/testing/document-library-harness.ts': [
                  ('runtimeFlags: { documentsEnabled: true }, roomStateConnected: true,', 'runtimeFlags: { documentsEnabled: true as boolean }, roomStateConnected: true as boolean,'),
                  ('presentationActionInFlight: false,', 'presentationActionInFlight: false as boolean,'),
                  ('return hooks.deleteRoomDocument ? hooks.deleteRoomDocument(...args) : undefined;', 'return hooks.deleteRoomDocument ? hooks.deleteRoomDocument(...args) : makeDocument("pdf");')],
              'apps/runtime-web/src/document-library-async.test.ts': [
                  ('const result = deferred<void>(); h.hooks.deleteRoomDocument = () => result.promise;', 'const result = deferred<RuntimeDocumentRecord>(); h.hooks.deleteRoomDocument = () => result.promise;'),
                  ('h.context.roomDocuments = [selected, latest]; result.resolve(); await pending;', 'h.context.roomDocuments = [selected, latest]; result.resolve(selected); await pending;')]
          }
          fixed_hashes = {
              'apps/runtime-web/src/testing/document-ui-dom.ts': '55bb243648ee1a300e9bd58d27b9cb5058f94c92',
              'apps/runtime-web/src/testing/document-library-harness.ts': 'c695af44fe19d51da6fe760de42181fe89b94256',
              'apps/runtime-web/src/document-library-async.test.ts': 'b8690ff246c2833b6b73ced04243e4ddbcf43a32'
          }
          for name, edits in fixes.items():
              for old, new in edits:
                  assert payload['files'][name].count(old) == 1
                  payload['files'][name] = payload['files'][name].replace(old, new)
              assert blob(payload['files'][name].encode()) == fixed_hashes[name]
          main = payload['main']
          assert main['path'] == 'apps/runtime-web/src/main.ts'
          path = pathlib.Path(main['path'])
          source = path.read_text()
          if blob(source.encode()) != main['after_git_sha']:
              assert blob(source.encode()) == main['before_git_sha']
              for edit in sorted(main['edits'], key=lambda x: x['start'], reverse=True):
                  source = source[:edit['start']] + edit['text'] + source[edit['end']:]
              assert blob(source.encode()) == main['after_git_sha']
              path.write_text(source)
          assert len(payload['files']) == 10
          for name, content in payload['files'].items():
              path = pathlib.Path(name)
              assert name.startswith('apps/runtime-web/src/') and path.suffix == '.ts'
              assert '..' not in path.parts
              if path.exists():
                  assert path.read_text() == content, name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          paths = sorted([main['path'], *payload['files']])
          pathlib.Path('/tmp/refactor-files.json').write_text(json.dumps(paths, indent=2))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          pathlib.Path('/tmp/refactor.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          print(json.dumps({name: blob(pathlib.Path(name).read_bytes()) for name in paths}, indent=2))
          PY
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts and runtime
        run: pnpm --filter @vrata/shared-types --filter @vrata/runtime-web build 2>&1 | tee /tmp/refactor-build.log
      - name: Runtime lint and typecheck
        run: |
          pnpm --filter @vrata/runtime-web lint
          pnpm --filter @vrata/runtime-web typecheck
      - name: Full runtime unit suite
        run: pnpm --filter @vrata/runtime-web test 2>&1 | tee /tmp/refactor-tests.log
      - name: Commit verified changes to isolated branch only
        run: |
          test "$GITHUB_REF_NAME" = 'chore/refactor-runtime-workbench-20260929'
          python3 - <<'PY'
          import json, pathlib, subprocess
          expected = set(json.loads(pathlib.Path('/tmp/refactor-files.json').read_text()))
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert staged <= expected, staged - expected
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(runtime): extract document library views and controls'
            git push origin HEAD:refs/heads/chore/refactor-runtime-workbench-20260929
          fi
          git rev-parse HEAD | tee /tmp/refactor-commit.txt
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-verification
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /tmp/refactor-files.json
            /tmp/refactor.patch
            /tmp/refactor-build.log
            /tmp/refactor-tests.log
            /tmp/refactor-commit.txt
