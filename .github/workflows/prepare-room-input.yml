name: Prepare room input extraction
on:
  push:
    branches: [preparation/api-room-input-20260913]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 91cc21541ec062562ee9412e06d80d709e6a7419
      TARGET_BRANCH: refactor/api-room-input-20260913
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout preparation with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Extract exact original implementation on clean base
        shell: bash
        run: |
          test "$(git hash-object apps/api/src/room-input.test.ts)" = 4c961c299ba0c7fe0a90b909d8f43431db6ce4b8
          cp apps/api/src/room-input.test.ts "$RUNNER_TEMP/room-input.test.ts"
          git checkout --detach "$BASE_SHA"
          test -z "$(git status --porcelain)"
          cp "$RUNNER_TEMP/room-input.test.ts" apps/api/src/room-input.test.ts
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          import re

          path = Path('apps/api/src/index.ts')
          original = path.read_text()
          def blob(text):
              data = text.encode()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(original) == '71b7f493c59783d48256298e0e3de8d1d966959a', 'unexpected original index'
          markers = [
              ('function isRoomVisibility(', 'function isRoomDisabled('),
              ('function normalizeParticipantId(', 'function normalizeDisplayName('),
              ('function validateRoomInput(', 'async function validateRoomAssetIds('),
          ]
          blocks = []
          modified = original
          for start, end in markers:
              block = original[original.index(start):original.index(end, original.index(start))]
              assert modified.count(block) == 1
              blocks.append(block)
              modified = modified.replace(block, '')
          module = 'import type { RoomRecord, RoomVisibility } from "./storage.js";\n\n' + ''.join(
              re.sub(r'(?m)^(function|type) ', r'export \1 ', block) for block in blocks
          ).rstrip() + '\n'
          imports = '''\nimport {
            isRoomVisibility,
            sanitizeRoomVisibility,
            normalizeParticipantId,
            validateRoomInput,
            normalizeRoomPayload,
            type RoomPayloadInput
          } from "./room-input.js";
          '''
          anchor = 'import { parseBody, readRequestBuffer } from "./request-body.js";\n'
          modified = modified.replace(anchor, anchor + imports).replace('  type RoomVisibility,\n', '')
          # Reinsert exact source blocks and undo only import edits to prove the rest is untouched.
          restored = modified.replace(imports, '').replace('  type RuntimeDiagnosticRecord,\n', '  type RoomVisibility,\n  type RuntimeDiagnosticRecord,\n')
          for (_, end), block in zip(markers, blocks):
              restored = restored.replace(end, block + end, 1)
          assert restored == original, 'reverse extraction mismatch'
          assert module.count('export function ') == 5
          assert module.count('export type ') == 1
          path.write_text(modified)
          path.with_name('room-input.ts').write_text(module)
          print('exact reverse reconstruction: PASS')
          print('index:', blob(modified), 'lines:', len(original.splitlines()), '->', len(modified.splitlines()))
          print('module:', blob(module), 'lines:', len(module.splitlines()))
          assert blob(modified) == '5da8f76c4b81e76ea29a62862a9f16c4e751e4ce'
          assert blob(module) == '332c77f8901dfa6a6d8130ce1e7ff122aa30e37c'
          PYCODE
          git diff --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Contract tests
        run: node --test apps/api/dist/room-input.test.js
      - name: Workspace tests including PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: pnpm test
      - name: Publish only the three reviewed code files
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git add apps/api/src/index.ts apps/api/src/room-input.ts apps/api/src/room-input.test.ts
          python3 - <<'PYCODE'
          import subprocess
          expected = {'apps/api/src/index.ts', 'apps/api/src/room-input.ts', 'apps/api/src/room-input.test.ts'}
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == expected, actual
          PYCODE
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(api): extract room input normalization' -m 'Mechanically extract five room input helpers and their input type. Preserve validation order, privacy defaults, legacy avatar precedence, identity trimming and shallow-copy semantics. Add 34 contract tests. Preparation workflow is excluded.'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/candidate-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/candidate-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/candidate-source.tgz" HEAD
      - name: Archive exact candidate source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-input-candidate-source
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/candidate-tree.txt
            ${{ runner.temp }}/candidate-source.tgz
