name: Prepare room session control extraction
on:
  push:
    branches: [preparation/api-room-session-control-20260913]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASE_SHA: 9f3acb0ab896fa8371dc00d971e02eae699e2a65
      TARGET_BRANCH: refactor/api-room-session-control-20260913
      EXPECTED_TREE: fa87ec217f487a89d4960e8f9f655d619ce34edc
    steps:
      - name: Checkout preparation with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply the exact locally tested extraction to the clean base
        shell: bash
        run: |
          cp apps/api/src/room-session-control.test.ts "$RUNNER_TEMP/room-session-control.test.ts"
          git checkout --detach "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          p = Path('apps/api/src/index.ts')
          original = p.read_text()
          def blob(content):
              data = content.encode()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(original) == '5da8f76c4b81e76ea29a62862a9f16c4e751e4ce'
          starts = [original.index('function isRoomDisabled('), original.index('function defaultSessionControlState(')]
          ends = [original.index('const controlPlanePermissions:', starts[0]), original.index('async function updateRoomSessionControl(', starts[1])]
          blocks = [original[a:b] for a, b in zip(starts, ends)]
          exports = ['isRoomDisabled', 'defaultSessionControlState', 'sanitizeSessionControlState', 'getRemovedParticipant', 'resolveEffectiveRoomRole', 'getSessionControlBlockReason']
          header = 'import type { RoomRole } from "@vrata/shared-types";\nimport type { RoomRecord, RoomSessionControlState } from "./storage.js";\n\nimport { isHostControlsEnabled } from "./feature-flags.js";\n\n'
          body = ''.join(blocks).rstrip() + '\n'
          for name in exports:
              body = body.replace(f'function {name}(', f'export function {name}(')
          module = header + body
          anchor = 'import { defaultManifest, type RoomManifest } from "./default-room-manifest.js";\n'
          imp = '\nimport {\n' + ''.join('  ' + n + (',' if i < len(exports) - 1 else '') + '\n' for i, n in enumerate(exports)) + '} from "./room-session-control.js";\n'
          new = original.replace(anchor, anchor + imp)
          for block in blocks:
              new = new.replace(block, '', 1)
          reverse = new.replace(imp, '', 1)
          reverse = reverse.replace('const controlPlanePermissions:', blocks[0] + 'const controlPlanePermissions:', 1)
          reverse = reverse.replace('async function updateRoomSessionControl(', blocks[1] + 'async function updateRoomSessionControl(', 1)
          assert reverse == original
          tests = (Path(os.environ['RUNNER_TEMP']) / 'room-session-control.test.ts').read_text()
          assert blob(new) == 'af3ac8410a1faa72e4a179c4c2a224e0ed5aef52'
          assert blob(module) == 'c17bf9ab6450c673b9e3330b615c89acc92dfc00'
          assert blob(tests) == 'b95f2837f594648e320c6fe45591a599531b6570'
          p.write_text(new)
          p.with_name('room-session-control.ts').write_text(module)
          p.with_name('room-session-control.test.ts').write_text(tests)
          print('exact_extraction_and_reverse_reconstruction:passed')
          print('index_lines:4058->3985; module_lines:86; tests_lines:221')
          PY
          git add apps/api/src/index.ts apps/api/src/room-session-control.ts apps/api/src/room-session-control.test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Contract tests
        run: node --test apps/api/dist/room-session-control.test.js
      - name: Workspace tests including PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: pnpm test
      - name: Publish only the three reviewed code files
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(api): extract room session control rules' -m 'Mechanically extract seven existing functions. Preserve role resolution, block precedence, nullish defaults, copy semantics and call-time feature flags. Add 32 contract tests. Only three code files; preparation workflow excluded.'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha:$(git rev-parse HEAD)"
          echo "candidate_tree:$(git rev-parse HEAD^{tree})"
