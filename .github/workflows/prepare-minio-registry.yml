name: Prepare staging MinIO registry repair
on:
  push:
    branches: [preparation/staging-minio-registry-20260912]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify the completed isolated storage integration evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/vrata-labs/platform/actions/runs/34702102487 > "$RUNNER_TEMP/storage-run.json"
          gh api repos/vrata-labs/platform/actions/jobs/103575569420 > "$RUNNER_TEMP/storage-job.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'storage-run.json').read_text())
          job = json.loads((root / 'storage-job.json').read_text())
          assert run['head_sha'] == '9e4a0adf868d5293d06938a4fb37c92f1093cf95'
          assert job['run_id'] == run['id'] == 34702102487
          steps = {step['name']: step['conclusion'] for step in job['steps']}
          for name in ['Apply exact locally reviewed patch', 'Cold-pull storage images and verify bootstrap and legacy rollback compatibility', 'Lint typecheck build and full unit integration tests']:
              assert steps[name] == 'success', (name, steps[name])
          assert steps['Publish only the exact five reviewed files'] == 'failure'
          print('previous_storage_and_full_verification_passed:34702102487; publishing_step_failed_only')
          PY
      - name: Apply exact locally reviewed and container-tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin b5b2331ba1c4ef340ab7da1a74c4d7e9995c4e6a
          test "$(git rev-parse b5b2331ba1c4ef340ab7da1a74c4d7e9995c4e6a^{tree})" = 032d97ed9ce9ace703f84041681e05fd0960a18f
          git diff --exit-code b5b2331ba1c4ef340ab7da1a74c4d7e9995c4e6a HEAD -- . ':(exclude).github/workflows/prepare-minio-registry.yml'
          gh api repos/vrata-labs/platform/git/blobs/a8514ba81dc74f02bedbe927656a09e2c1eafdd4 --jq .content | base64 -d | gzip -dc > "$RUNNER_TEMP/repair.patch"
          echo "1768b899fbb0a7d28b452e4661cffd66163acd4d7d8547022fab888fba44f4cf  $RUNNER_TEMP/repair.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
          python3 -m py_compile tools/staging-minio-rollout.py
          node --test tools/staging-minio-rollout.test.mjs tools/staging-scene-snapshot.test.mjs tools/docker-publish-workflow.test.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Repeat full project checks
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test
          docker compose --env-file infra/docker/.env.staging.example -f infra/docker/compose.staging.yml config --quiet
          git diff --check
      - name: Publish exact reviewed tree without changing the working checkout
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile
          from pathlib import Path
          base = 'b5b2331ba1c4ef340ab7da1a74c4d7e9995c4e6a'
          paths = [
              '.github/workflows/staging-deploy.yml',
              'infra/docker/compose.staging.yml',
              'tools/staging-minio-rollout.py',
              'tools/staging-minio-rollout.test.mjs',
              'docs/ops/staging-minio-registry.md',
          ]
          with tempfile.TemporaryDirectory() as tmp:
              env = dict(os.environ, GIT_INDEX_FILE=str(Path(tmp) / 'index'))
              def git(*args):
                  return subprocess.check_output(['git', *args], env=env, text=True).strip()
              git('read-tree', base)
              for path in paths:
                  assert Path(path).is_file(), path
                  print('stage_exact_file:' + path, flush=True)
                  git('add', '--', path)
              tree = git('write-tree')
              print('candidate_tree:' + tree, flush=True)
              assert tree == 'e0a740ba3b0751b6f90d912c88f4e351f94cdb0d', tree
              assert sorted(git('diff', '--cached', '--name-only', base).splitlines()) == sorted(paths)
              git('diff', '--cached', '--check', base)
              commit = git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit-tree', tree, '-p', base, '-m', 'fix(staging): restore pinned MinIO pulls and older-commit rollback', '-m', 'Keep existing storage releases and data. Official Quay digest pins and a narrowly scoped legacy-reference adapter preserve all staging gates. Cold Docker storage tests passed in 34702102487; full project checks repeated before publication. No preparation workflow is included.')
              git('push', 'origin', commit + ':refs/heads/fix/staging-minio-registry-20260912')
              print('candidate_sha:' + commit + ' tree:' + tree, flush=True)
          PY
