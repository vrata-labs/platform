name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Skip browser e2e for documentation-only changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Unit tests always run; only a diff made of docs/ and Markdown skips the browser shards.
        run: |
          e2e=true
          if [ "$EVENT" != workflow_dispatch ] && [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            if files="$(git diff --name-only "$BASE" "$HEAD")" && [ -n "$files" ] && ! grep -qvE '^(docs/|.*\.md$)' <<<"$files"; then
              e2e=false
            fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "browser e2e: $e2e"

  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `lint` and `typecheck` are the same `tsc --noEmit` per package that `build` runs with emit.
      - name: Build
        run: pnpm build

      - name: Self-host compose config
        run: docker compose --env-file infra/docker/.env.selfhost.example -f infra/docker/compose.selfhost.yml config

      - name: Production compose config
        run: docker compose --env-file infra/docker/.env.production.example -f infra/docker/compose.production.yml config

      - name: Production preflight rejects example secrets
        run: |
          set +e
          node tools/validate-production-config.mjs --env-file infra/docker/.env.production.example > /tmp/vrata-production-preflight.out 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/vrata-production-preflight.out
            echo "expected production preflight to reject .env.production.example" >&2
            exit 1
          fi
          if grep -E "REPLACE_WITH_" /tmp/vrata-production-preflight.out; then
            echo "preflight output leaked placeholder values" >&2
            exit 1
          fi

      - name: Checkout proven template rollback base
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: 33c7485ffa1773105c496b43542ea53bf4c5ae9a
          path: .template-rollback

      - name: Build template rollback base
        run: |
          pnpm --dir .template-rollback install --frozen-lockfile
          # pnpm marks workspace bin entries executable; restore the historical
          # Git mode before asserting an otherwise byte-identical rollback tree.
          chmod 644 .template-rollback/packages/asset-pipeline/bin/vrata.mjs
          git -C .template-rollback diff --exit-code HEAD
          pnpm --dir .template-rollback --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline --filter @vrata/api build

      - name: Checkout identity rollback base
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: 954a976af3d7352fa54ce1454f63ecc1d082694d
          path: .identity-rollback

      - name: Build identity rollback base
        run: |
          pnpm --dir .identity-rollback install --frozen-lockfile
          # pnpm marks workspace bin entries executable; restore the pinned
          # checkout's Git mode before asserting an otherwise unchanged tree.
          chmod 644 .identity-rollback/packages/asset-pipeline/bin/vrata.mjs
          git -C .identity-rollback diff --exit-code HEAD
          pnpm --dir .identity-rollback --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline --filter @vrata/api build

      - name: Checkout accepted identity boundary
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: 033bd6e2b33e9149221464c934554977320ca36f
          path: .identity-boundary-rollback

      - name: Build accepted identity boundary
        run: |
          pnpm --dir .identity-boundary-rollback install --frozen-lockfile
          chmod 644 .identity-boundary-rollback/packages/asset-pipeline/bin/vrata.mjs
          git -C .identity-boundary-rollback diff --exit-code HEAD
          pnpm --dir .identity-boundary-rollback --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline --filter @vrata/api build

      - name: Checkout room-record reader rollback base
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: 9b1d43f0eb7efe2fc2f8684669eda7379635c01c
          path: .room-record-reader-rollback

      - name: Build room-record reader rollback base
        run: |
          pnpm --dir .room-record-reader-rollback install --frozen-lockfile
          chmod 644 .room-record-reader-rollback/packages/asset-pipeline/bin/vrata.mjs
          git -C .room-record-reader-rollback diff --exit-code HEAD
          pnpm --dir .room-record-reader-rollback --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline --filter @vrata/room-plugin-sdk --filter @vrata/api build

      - name: Checkout pinned plugin rollback base
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: 81c14b6ac8dbc537892f7b1f342ca8f718fdf0a6
          path: .plugin-rollback

      - name: Build plugin rollback base
        run: |
          pnpm --dir .plugin-rollback install --frozen-lockfile
          chmod 644 .plugin-rollback/packages/asset-pipeline/bin/vrata.mjs
          git -C .plugin-rollback diff --exit-code HEAD
          # HTTP room entry also needs the pinned runtime's index.html and SDK build.
          pnpm --dir .plugin-rollback --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline --filter @vrata/room-plugin-sdk --filter @vrata/runtime-web --filter @vrata/api build

      - name: Test
        # Plugin rollback is checked out independently: the main checkout may be shallow.
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
          VRATA_TEMPLATE_ROLLBACK_STORAGE_MODULE: ${{ github.workspace }}/.template-rollback/apps/api/dist/storage.js
          VRATA_IDENTITY_ROLLBACK_API_ENTRY: ${{ github.workspace }}/.identity-rollback/apps/api/dist/index.js
          VRATA_BOUNDARY_ROLLBACK_STORAGE_MODULE: ${{ github.workspace }}/.identity-boundary-rollback/apps/api/dist/storage.js
          VRATA_READER_ROLLBACK_STORAGE_MODULE: ${{ github.workspace }}/.room-record-reader-rollback/apps/api/dist/storage.js
          VRATA_PLUGIN_ROLLBACK_STORAGE_MODULE: ${{ github.workspace }}/.plugin-rollback/apps/api/dist/storage.js
        run: pnpm test


  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Balanced by measured duration (tools/e2e-shard.mjs); workers=1 inside each runner.
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Cache pinned public reference assets
        uses: actions/cache@v4
        with:
          path: .reference-scene-assets
          key: reference-scenes-${{ hashFiles('packages/templates/src/product-room-definitions.ts') }}

      - name: Verify pinned public assets for isolated template e2e
        run: node tools/fetch-reference-template-fixtures.mjs

      - name: E2E
        env:
          PLAYWRIGHT_REPORT_NAME: local-e2e-${{ matrix.shard }}
          PLAYWRIGHT_TRACE: "1"
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: |
          mapfile -t specs < <(node tools/e2e-shard.mjs "${{ matrix.shard }}" "${{ strategy.job-total }}")
          test "${#specs[@]}" -gt 0
          pnpm test:e2e -- "${specs[@]}"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  # Branch protection requires a check named "checks": it now gates the unit job and every e2e shard.
  checks:
    needs: [changes, core, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the unit job and every browser shard
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_SCOPE: ${{ needs.changes.outputs.e2e }}
        run: |
          test "$CHANGES" = success
          test "$CORE" = success
          if [ "$E2E_SCOPE" = false ]; then test "$E2E" = skipped; else test "$E2E" = success; fi

  scene-repositories:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lock.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact scene repository revisions
        id: lock
        run: echo "matrix=$(node tools/scene-repositories.mjs)" >> "$GITHUB_OUTPUT"

  asset-validation:
    needs: scene-repositories
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scene-repositories.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout locked scene assets
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commitSha }}
          path: ${{ matrix.path }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build asset and template contracts
        run: pnpm --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline build

      - name: Asset pipeline tests
        run: pnpm --filter @vrata/asset-pipeline test

      - name: Asset validator sample run
        run: pnpm --filter @vrata/asset-pipeline validate:sample

      - name: Validate locked reference template assets
        env:
          VRATA_SCENE_REPOSITORY: ${{ matrix.repository }}
          VRATA_SCENE_COMMIT_SHA: ${{ matrix.commitSha }}
        run: pnpm validate:reference-template-assets

  asset-validation-gate:
    name: asset-validation
    needs: asset-validation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every scene validation to succeed
        env:
          ASSET_VALIDATION_RESULT: ${{ needs.asset-validation.result }}
        run: test "$ASSET_VALIDATION_RESULT" = success
