name: CI

on:
  push:
    branches:
      - main
      - deploy/scene-bundles-stage-20260328
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          base: ${{ github.ref }}
          initial-fetch-depth: 20
          predicate-quantifier: every
          filters: |
            heavy:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!.opencode/**'
              - '!opencode.json'
              - '!opencode.jsonc'

  core_checks:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Self-host compose config
        run: docker compose --env-file infra/docker/.env.selfhost.example -f infra/docker/compose.selfhost.yml config

      - name: Production compose config
        run: docker compose --env-file infra/docker/.env.production.example -f infra/docker/compose.production.yml config

      - name: Production preflight rejects example secrets
        run: |
          set +e
          node tools/validate-production-config.mjs --env-file infra/docker/.env.production.example > /tmp/vrata-production-preflight.out 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/vrata-production-preflight.out
            echo "expected production preflight to reject .env.production.example" >&2
            exit 1
          fi
          if grep -E "REPLACE_WITH_" /tmp/vrata-production-preflight.out; then
            echo "preflight output leaked placeholder values" >&2
            exit 1
          fi

      - name: Test
        run: pnpm test

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test compatibility validator
        run: node --test tools/validate-compatibility-matrix.test.mjs

      - name: Validate compatibility matrix
        run: node tools/validate-compatibility-matrix.mjs

  e2e:
    needs:
      - changes
      - core_checks
    if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true' && needs.core_checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_RUN_ID: ci-${{ github.run_id }}-${{ matrix.shard }}
      E2E_RUN_DIR: /tmp/vrata-e2e-${{ matrix.shard }}
      E2E_LOG_DIR: /tmp/vrata-e2e-${{ matrix.shard }}/logs
      E2E_STARTUP_STATUS_PATH: /tmp/vrata-e2e-${{ matrix.shard }}/startup-status.json
      E2E_PID_MANIFEST_PATH: /tmp/vrata-e2e-${{ matrix.shard }}/pids.json
    strategy:
      fail-fast: false
      matrix:
        shard:
          - runtime
          - other
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (${{ matrix.shard }})
        env:
          PLAYWRIGHT_REPORT_NAME: local-e2e-${{ matrix.shard }}
        run: |
          if [ "${{ matrix.shard }}" = "runtime" ]; then
            pnpm exec playwright test tests/e2e/runtime.spec.ts --grep-invert "@staging|@private-assets"
          else
            E2E_EXCLUDE_RUNTIME_SPEC=1 pnpm exec playwright test --grep-invert "@staging|@private-assets"
          fi

      - name: Assert E2E cleanup
        if: always()
        run: node tools/start-e2e-services.mjs --assert-clean

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            playwright-report/local-e2e-${{ matrix.shard }}/
            test-results/local-e2e-${{ matrix.shard }}/
            test-results/local-e2e-${{ matrix.shard }}.json
            /tmp/vrata-e2e-${{ matrix.shard }}/logs/

  checks:
    needs:
      - changes
      - compatibility
      - core_checks
      - e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          CORE_RESULT: ${{ needs.core_checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change classifier finished with $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$COMPATIBILITY_RESULT" != "success" ]; then
            echo "compatibility validation finished with $COMPATIBILITY_RESULT" >&2
            exit 1
          fi
          if [ "$HEAVY" != "true" ] && [ "$HEAVY" != "false" ]; then
            echo "change classifier returned invalid heavy output: $HEAVY" >&2
            exit 1
          fi
          if [ "$HEAVY" = "true" ]; then
            if [ "$CORE_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
              echo "heavy CI failed: core=$CORE_RESULT e2e=$E2E_RESULT" >&2
              exit 1
            fi
            echo "Core checks and both E2E shards passed."
          else
            echo "No build or runtime files changed; heavy CI was skipped."
            {
              echo "### CI mode"
              echo
              echo "Docs-only change detected. Core checks and E2E shards were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  asset-validation:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate change classification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "change classifier finished with $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$HEAVY" != "true" ] && [ "$HEAVY" != "false" ]; then
            echo "change classifier returned invalid heavy output: $HEAVY" >&2
            exit 1
          fi

      - name: Skip asset validation for docs-only changes
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'false'
        run: |
          echo "No build or runtime files changed; asset validation was skipped."
          {
            echo "### Asset validation mode"
            echo
            echo "Docs-only change detected. Asset build, tests, and sample validation were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build asset pipeline
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @vrata/asset-pipeline build

      - name: Asset pipeline tests
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @vrata/asset-pipeline test

      - name: Asset validator sample run
        if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @vrata/asset-pipeline validate:sample
