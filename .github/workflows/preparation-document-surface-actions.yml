name: Prepare document surface actions
on:
  push:
    branches: [preparation/document-surface-actions-20260924]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d vrata_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASE: 54e13fec4ee14134597c6520a3cfa9b0db291032
      EXPECTED_TREE: 6c367102d7d1fc2fa41067613487741efa83b6f7
      TARGET: refactor/document-surface-actions-20260924
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore reviewed patch and verification helper
        env:
          PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          data = base64.b64decode(os.environ['PAYLOAD'], validate=True)
          assert hashlib.sha256(data).hexdigest() == '6821ba917e997e0843aed29e04b992c32092c66273793c9d8f7b6e8f77cbd5a2'
          output = Path(os.environ['RUNNER_TEMP']) / 'document-actions-verification'
          output.mkdir()
          files = json.loads(gzip.decompress(data))
          assert set(files) == {'reviewed.patch', 'verify.cjs'}
          for name, content in files.items():
              (output / name).write_text(content)
          PY
          echo "VERIFY_OUTPUT=$RUNNER_TEMP/document-actions-verification" >> "$GITHUB_ENV"
      - name: Build exact unchanged baseline
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/document-actions-baseline" "$BASE"
          pnpm --dir "$RUNNER_TEMP/document-actions-baseline" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/document-actions-baseline" build > "$VERIFY_OUTPUT/baseline-build.log" 2>&1
      - name: Apply reviewed source changes
        run: |
          set -euo pipefail
          git apply --check "$VERIFY_OUTPUT/reviewed.patch"
          git apply "$VERIFY_OUTPUT/reviewed.patch"
          pnpm install --frozen-lockfile
          node "$VERIFY_OUTPUT/verify.cjs" source "$BASE" | tee "$VERIFY_OUTPUT/source-equivalence.log"
      - name: Lint
        run: pnpm lint > "$VERIFY_OUTPUT/lint.log" 2>&1
      - name: Typecheck
        run: pnpm typecheck > "$VERIFY_OUTPUT/typecheck.log" 2>&1
      - name: Build
        run: pnpm build > "$VERIFY_OUTPUT/build.log" 2>&1
      - name: Checkout proven template rollback base
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: 33c7485ffa1773105c496b43542ea53bf4c5ae9a
          path: .template-rollback
      - name: Build template rollback base
        run: |
          pnpm --dir .template-rollback install --frozen-lockfile
          chmod 644 .template-rollback/packages/asset-pipeline/bin/vrata.mjs
          git -C .template-rollback diff --exit-code HEAD
          pnpm --dir .template-rollback --filter @vrata/shared-types --filter @vrata/templates --filter @vrata/asset-pipeline --filter @vrata/api build
      - name: Full tests with PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
          VRATA_TEMPLATE_ROLLBACK_STORAGE_MODULE: ${{ github.workspace }}/.template-rollback/apps/api/dist/storage.js
        run: pnpm test > "$VERIFY_OUTPUT/test.log" 2>&1
      - name: Verify actual compiler output and original behavior
        run: |
          set -euo pipefail
          node "$VERIFY_OUTPUT/verify.cjs" compiled "$RUNNER_TEMP/document-actions-baseline/apps/runtime-web/dist" | tee "$VERIFY_OUTPUT/compiled-equivalence.log"
      - name: Publish only the verified source tree
        run: |
          set -euo pipefail
          BIN=packages/asset-pipeline/bin/vrata.mjs
          test "$(git hash-object "$BIN")" = "$(git rev-parse "$BASE:$BIN")"
          test "$(git ls-tree "$BASE" "$BIN" | cut -d' ' -f1)" = 100644
          test "$(stat -c %a "$BIN")" = 755 -o "$(stat -c %a "$BIN")" = 644
          chmod 644 "$BIN"
          git read-tree "$BASE"
          git add apps/runtime-web/src/main.ts apps/runtime-web/src/document-surface-actions.ts apps/runtime-web/src/document-surface-controls.test.ts apps/runtime-web/src/document-surface-selection.test.ts apps/runtime-web/src/testing/document-surface-actions-harness.ts
          git diff --cached --check
          git diff --exit-code
          TREE=$(git write-tree)
          test "$TREE" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only "$BASE" | wc -l)" = 5
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test -z "$(git ls-remote origin "refs/heads/$TARGET")"
          COMMIT=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$TREE" -p "$BASE" -m 'refactor(runtime): isolate document surface actions')
          git archive "$COMMIT" | gzip > "$VERIFY_OUTPUT/source.tar.gz"
          tar -czf "$VERIFY_OUTPUT/runtime-dist.tar.gz" apps/runtime-web/dist
          tar -C "$RUNNER_TEMP/document-actions-baseline" -czf "$VERIFY_OUTPUT/baseline-runtime-dist.tar.gz" apps/runtime-web/dist
          git ls-tree -r "$COMMIT" > "$VERIFY_OUTPUT/tree.txt"
          printf '%s\n' "$COMMIT" > "$VERIFY_OUTPUT/head.txt"
          git diff --cached --stat "$BASE" > "$VERIFY_OUTPUT/diff-stat.txt"
          git push origin "$COMMIT:refs/heads/$TARGET"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-surface-actions-preparation-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/document-actions-verification/
