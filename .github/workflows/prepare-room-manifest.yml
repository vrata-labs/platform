name: Prepare room manifest extraction
on:
  push:
    branches: [preparation/api-decomposition-20260913b]
    paths: [.github/workflows/prepare-room-manifest.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout preparation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply exact extraction and preserve reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object AGENTS.md)" = 444218fb39af0ca11327fef9638b3373a5787dab
          test "$(git hash-object apps/api/src/index.ts)" = a4c2bbe304a6f468506e6312b28a9cc12eff920a
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil
          path = Path('apps/api/src/index.ts')
          original = path.read_text()
          start = original.index('async function buildManifest(')
          end = original.index('\nfunction getHeaderString(', start)
          old = original[start:end]
          module = Path('apps/api/src/room-manifest.ts').read_text()
          nested = module[module.index('  async function buildManifest('):module.index('\n\n  return buildManifest;')]
          assert '\n'.join(line[2:] if line.startswith('  ') else line for line in nested.split('\n')) == old.rstrip('\n')
          replacement = 'const buildManifest = createRoomManifestBuilder(storagePromise);\n'
          old_import = 'import { defaultManifest, type RoomManifest } from "./default-room-manifest.js";'
          new_import = 'import { defaultManifest } from "./default-room-manifest.js";\nimport { createRoomManifestBuilder } from "./room-manifest.js";'
          result = (original[:start] + replacement + original[end:]).replace(old_import, new_import).replace('  getDefaultRoomStateUrl,\n', '')
          restored = result.replace(replacement, old).replace(new_import, old_import).replace('  getRequestProto,\n', '  getRequestProto,\n  getDefaultRoomStateUrl,\n')
          assert restored == original
          path.write_text(result)
          expected = {
            'index.ts': '78ac568d5cd1b9bfdc5842ec2cd37b6146afb4e8ba7d6ccfe9311101bf480c5f',
            'room-manifest.ts': '35875b38ccc1c525626ed4aa3caf19f4696b6759410a652d957111b5eeac0c44',
            'room-manifest.test.ts': '430e8de1115d210f6aa592cdb3da3c2913e8efeec7535764bfa1784df2f19c6e'
          }
          frozen = Path(os.environ['RUNNER_TEMP']) / 'reviewed'
          frozen.mkdir()
          lines = []
          for name, digest in expected.items():
            source = Path('apps/api/src') / name
            assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, name
            shutil.copyfile(source, frozen / name)
            lines.append(f'{digest}  {source}')
          (Path(os.environ['RUNNER_TEMP']) / 'reviewed.sha256').write_text('\n'.join(lines) + '\n')
          print('Exact inverse reconstruction and all three source hashes verified')
          PY
          git diff --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Manifest contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/api/dist/room-manifest.test.js | tee "$RUNNER_TEMP/room-manifest-contracts.log"
      - name: Workspace tests including PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: pnpm test
      - name: Verify tested files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/reviewed.sha256"
      - name: Checkout clean publication base independently of tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vrata-labs/platform
          ref: 8290fb37ec0cf41cbe2793b4f1bfd2e4bf31601a
          path: publication
      - name: Commit and push only the three verified files
        working-directory: publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8290fb37ec0cf41cbe2793b4f1bfd2e4bf31601a
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 8290fb37ec0cf41cbe2793b4f1bfd2e4bf31601a
          for name in index.ts room-manifest.ts room-manifest.test.ts; do
            cp "$RUNNER_TEMP/reviewed/$name" "apps/api/src/$name"
          done
          sha256sum --check "$RUNNER_TEMP/reviewed.sha256"
          git add apps/api/src/index.ts apps/api/src/room-manifest.ts apps/api/src/room-manifest.test.ts
          git diff --cached --check
          test "$(git write-tree)" = 58b58e5fd399c33803a92ea523fc1a1bfbd640b0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(api): extract room manifest builder' -m 'Move the existing async builder unchanged behind an injected storage promise. Preserve room/template/asset read ordering, fallback template resolution, reference semantics, defaults and call-time flags. Add 26 contract tests. Only three code files; preparation workflows excluded.'
          git push origin HEAD:refs/heads/refactor/api-room-manifest-20260913
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/candidate-source.tgz" HEAD
      - name: Preserve exact candidate source and contract results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-manifest-candidate-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/candidate-source.tgz
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/reviewed.sha256
            ${{ runner.temp }}/room-manifest-contracts.log
