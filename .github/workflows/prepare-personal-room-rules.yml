name: Prepare personal room rules extraction
on:
  push:
    branches: [preparation/api-personal-room-rules-20260913]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASE_SHA: 2bcf303da9797d6f1acb35fbd2e267ed0a016e1f
      TARGET_BRANCH: refactor/api-personal-room-rules-20260913
      EXPECTED_TREE: f6690ffac9c210a13a1f99d6f6065df7c1683a63
    steps:
      - name: Checkout preparation with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact extraction and preserve reviewed source bytes
        shell: bash
        run: |
          cp apps/api/src/personal-room-rules.test.ts "$RUNNER_TEMP/personal-room-rules.test.ts"
          git checkout --detach "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          p = Path('apps/api/src/index.ts')
          original = p.read_text()
          def blob(content):
              data = content.encode()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(original) == 'af3ac8410a1faa72e4a179c4c2a224e0ed5aef52'
          starts = [original.index('function isPersonalRoom('), original.index('function personalRoomName(')]
          ends = [original.index('function createPersonalRoomId(', starts[0]), original.index('function canReadPrivateRoomWithControlPlaneActor(', starts[1])]
          blocks = [original[a:b] for a, b in zip(starts, ends)]
          exports = ['isPersonalRoom', 'isPersonalRoomOwner', 'normalizeDisplayName', 'personalRoomName', 'normalizePersonalState']
          body = ''.join(blocks).rstrip() + '\n'
          for name in exports:
              body = body.replace(f'function {name}(', f'export function {name}(')
          module = 'import type { RoomRecord, RoomPersonalState } from "./storage.js";\n\n' + body
          anchor = '} from "./room-session-control.js";\n'
          imp = '\nimport {\n' + ''.join('  ' + n + (',' if i < len(exports) - 1 else '') + '\n' for i, n in enumerate(exports)) + '} from "./personal-room-rules.js";\n'
          new = original.replace(anchor, anchor + imp, 1).replace('  type RoomPersonalState,\n', '', 1)
          for block in blocks:
              new = new.replace(block, '', 1)
          reverse = new.replace(imp, '', 1).replace('  type RoomRecord,\n', '  type RoomRecord,\n  type RoomPersonalState,\n', 1)
          reverse = reverse.replace('function createPersonalRoomId(', blocks[0] + 'function createPersonalRoomId(', 1)
          reverse = reverse.replace('function canReadPrivateRoomWithControlPlaneActor(', blocks[1] + 'function canReadPrivateRoomWithControlPlaneActor(', 1)
          assert reverse == original
          tests = (Path(os.environ['RUNNER_TEMP']) / 'personal-room-rules.test.ts').read_text()
          assert blob(new) == '7cd47def7d04b15d752a4036abde36d2da74f823'
          assert blob(module) == 'ac89d5c283a10ba569a5cfd082a19c6af935f129'
          assert blob(tests) == 'b13f3cfb29cc673802d276fbeec724be837e54a8'
          p.write_text(new)
          p.with_name('personal-room-rules.ts').write_text(module)
          p.with_name('personal-room-rules.test.ts').write_text(tests)
          saved = Path(os.environ['RUNNER_TEMP']) / 'reviewed-personal-room-rules'
          saved.mkdir()
          for name, content in [('index.ts', new), ('personal-room-rules.ts', module), ('personal-room-rules.test.ts', tests)]:
              (saved / name).write_text(content)
          print('exact_extraction_and_reverse_reconstruction:passed')
          print('index_lines:3985->3928; module_lines:65; tests_lines:196')
          PY
          git add apps/api/src/index.ts apps/api/src/personal-room-rules.ts apps/api/src/personal-room-rules.test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Contract tests
        run: node --test apps/api/dist/personal-room-rules.test.js
      - name: Workspace tests including PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: pnpm test
      - name: Checkout clean publication base independently of tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2bcf303da9797d6f1acb35fbd2e267ed0a016e1f
          path: publication
      - name: Publish only the three reviewed code files
        working-directory: publication
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          for name in index.ts personal-room-rules.ts personal-room-rules.test.ts; do
            cp "$RUNNER_TEMP/reviewed-personal-room-rules/$name" "apps/api/src/$name"
          done
          git add apps/api/src/index.ts apps/api/src/personal-room-rules.ts apps/api/src/personal-room-rules.test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(api): extract personal room rules' -m 'Mechanically extract six functions with unchanged bodies. Preserve ownership, name handling, numeric bounds, object lookup semantics and call-time timestamps. Add 29 contract tests. Only three code files; preparation workflow excluded.'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_sha:$(git rev-parse HEAD)"
          echo "candidate_tree:$(git rev-parse HEAD^{tree})"
          mkdir -p "$RUNNER_TEMP/personal-room-rules-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/personal-room-rules-source/candidate-source.tgz"
          git rev-parse HEAD > "$RUNNER_TEMP/personal-room-rules-source/candidate-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/personal-room-rules-source/candidate-tree.txt"
      - name: Preserve exact published source for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: personal-room-rules-source-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/personal-room-rules-source/
