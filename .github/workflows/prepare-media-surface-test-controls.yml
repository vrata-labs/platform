name: Prepare media surface test controls refactor
on:
  push:
    branches: [preparation/media-surface-test-controls-20260919]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASELINE_SHA: 86f5ae9e9167e2bfb66859328dd67bb79af36c73
      EXPECTED_TREE: 9986f6f8cb9952087b9a8dd8f599d0c5ee131a69
      TARGET_BRANCH: refactor/runtime-media-surface-test-controls-20260919
      EVIDENCE: /tmp/media-surface-test-controls-evidence
      TOOLS: /tmp/media-surface-test-controls-tools
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify tooling and check out exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS" "$EVIDENCE"
          cat .github/refactor-media-surface-test-controls/*.b64 | base64 --decode > "$TOOLS/tools.tgz"
          echo 'f81d45eb9bcbbe8b1fa39b8e570aa3cc413b6020e24be90603fad9ab3fb0caf1  /tmp/media-surface-test-controls-tools/tools.tgz' | sha256sum -c -
          tar -xzf "$TOOLS/tools.tgz" -C "$TOOLS"
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git rev-parse HEAD^{tree})" = e9713ad98883da832be5d4a720b980586c4ded64
          cp apps/runtime-web/src/main.ts "$EVIDENCE/main-baseline.ts"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies and build baseline
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build 2>&1 | tee "$EVIDENCE/baseline-build.log"
          cp -a apps/runtime-web/dist "$EVIDENCE/baseline-runtime-dist"
          tar -C apps/runtime-web -czf "$EVIDENCE/baseline-runtime-dist.tgz" dist
      - name: Apply and verify source-only extraction
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$TOOLS/refactor.patch"
          git apply "$TOOLS/refactor.patch"
          WORKSPACE="$GITHUB_WORKSPACE" TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript" node "$TOOLS/verify.cjs" --source-only
          git add apps/runtime-web/src/main.ts apps/runtime-web/src/testing/media-surface-test-controls.ts apps/runtime-web/src/testing/runtime-test-api.ts apps/runtime-web/src/testing/media-surface-test-controls.test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          cp "$TOOLS/metadata.json" "$TOOLS/extraction.json" "$EVIDENCE/"
          git diff --cached > "$EVIDENCE/refactor.patch"
      - name: Lint typecheck build and test
        shell: bash
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: |
          set -euo pipefail
          pnpm lint 2>&1 | tee "$EVIDENCE/lint.log"
          pnpm typecheck 2>&1 | tee "$EVIDENCE/typecheck.log"
          pnpm build 2>&1 | tee "$EVIDENCE/candidate-build.log"
          pnpm test 2>&1 | tee "$EVIDENCE/workspace-tests.log"
      - name: Verify emitted code and original behavior
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE" TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript" BASELINE_DIST="$EVIDENCE/baseline-runtime-dist" CANDIDATE_DIST="$GITHUB_WORKSPACE/apps/runtime-web/dist" node "$TOOLS/verify.cjs" | tee "$EVIDENCE/verification.log"
          tar -C apps/runtime-web -czf "$EVIDENCE/candidate-runtime-dist.tgz" dist
      - name: Publish only the four reviewed source files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASELINE_SHA"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(runtime): isolate media surface test controls'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git rev-parse HEAD > "$EVIDENCE/candidate-sha.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/candidate-tree.txt"
          git archive --format=tar.gz HEAD > "$EVIDENCE/candidate-source.tgz"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-surface-test-controls-refactor
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/media-surface-test-controls-evidence/*.log
            /tmp/media-surface-test-controls-evidence/*.json
            /tmp/media-surface-test-controls-evidence/*.txt
            /tmp/media-surface-test-controls-evidence/*.tgz
            /tmp/media-surface-test-controls-evidence/refactor.patch
            /tmp/media-surface-test-controls-evidence/main-baseline.ts
