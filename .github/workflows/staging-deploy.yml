name: Staging Deploy

on:
  workflow_run:
    workflows: ["Docker Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Immutable full image SHA
        required: true
        type: string
      bootstrap:
        description: First verified deployment on a designated new host
        default: false
        type: boolean
      force_fail_gate:
        description: Force the verification gate to fail after rollout
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (vars.STAGING_AUTO_DEPLOY_ENABLED != 'false' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    outputs:
      deploy_sha: ${{ steps.deploy.outputs.deploy_sha }}
      rutube_blocking: ${{ steps.remote_browser_impact.outputs.rutube_blocking }}
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
      PRIVATE_SCENE_ASSETS_REPOSITORY: ${{ secrets.PRIVATE_SCENE_ASSETS_REPOSITORY }}
      PRIVATE_SCENE_ASSETS_HOST_DIR: ${{ secrets.PRIVATE_SCENE_ASSETS_HOST_DIR }}
      STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
      YCR_USERNAME: ${{ secrets.YCR_USERNAME }}
      YCR_PASSWORD: ${{ secrets.YCR_PASSWORD }}
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_ASSET_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      PLAYWRIGHT_NO_WEB_SERVER: "1"
      BOOTSTRAP: ${{ inputs.bootstrap || false }}
      STAGING_HALL_ROOM_ID: 42db8225-f671-4e46-9c28-9381d66a948c
      STAGING_BLUEOFFICE_ROOM_ID: 0b537d34-7b92-4b51-854a-8c64cfb4c114
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
      - name: Configure SSH host identity
        env:
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Determine deploy SHA
        id: deploy
        env:
          MANUAL_DEPLOY_SHA: ${{ inputs.deploy_sha || '' }}
          WORKFLOW_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then SHA="$MANUAL_DEPLOY_SHA"; else SHA="$WORKFLOW_DEPLOY_SHA"; fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "deploy_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "STAGING_SCENE_BUNDLE_VERSION=$SHA" >> "$GITHUB_ENV"
      - name: Prepare scene rollback helper
        run: |
          mkdir -p "$RUNNER_TEMP/vrata-scene-rollback"
          cp tools/staging-scene-snapshot.mjs tools/patch-staging-scene-bundles.mjs "$RUNNER_TEMP/vrata-scene-rollback/"
          cp tools/staging-minio-rollout.py "$RUNNER_TEMP/vrata-scene-rollback/"
          cp tools/staging-template-catalog.py "$RUNNER_TEMP/vrata-scene-rollback/"
          cp tools/staging-accepted-release.py tools/staging-remote-release.py tools/staging_gate_proof.py tools/staging_scene_files.py "$RUNNER_TEMP/vrata-scene-rollback/"
          cp infra/docker/rollout-staging-images.sh "$RUNNER_TEMP/vrata-scene-rollback/"
          echo "REMOTE_HELPERS=${STAGING_APP_DIR}-stage-state/helpers/$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Wait for CI on exact SHA
        timeout-minutes: 32
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            CONCLUSION="$(gh run list --workflow CI --commit "$SHA" --limit 10 --json status,conclusion --jq 'map(select(.status == "completed")) | .[0].conclusion // ""')"
            if [ "$CONCLUSION" = success ]; then exit 0; fi
            if [ -n "$CONCLUSION" ]; then echo "ci_failed_for_deploy_sha:$SHA:$CONCLUSION" >&2; exit 1; fi
            echo "waiting_for_ci:$SHA:$attempt"
            sleep 30
          done
          exit 1

      - name: Prepare host protocol and read accepted state
        id: previous
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: |
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo test -f '$STAGING_APP_DIR/infra/docker/.env.staging'"
          BOOTSTRAP_ARG=; if [ "$BOOTSTRAP" = true ]; then BOOTSTRAP_ARG=--bootstrap; fi
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo python3 -B '${STAGING_APP_DIR}-stage-state/bootstrap-tools/staging-remote-release.py' preflight --root '$STAGING_APP_DIR' --image-sha '$SHA' $BOOTSTRAP_ARG" > "$RUNNER_TEMP/accepted-before.json"
          # Only a valid designated/accepted host can receive the new protocol.
          # shellcheck disable=SC2029
          tar -C "$RUNNER_TEMP/vrata-scene-rollback" -czf - . | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo mkdir -p '$REMOTE_HELPERS' && sudo tar -xzf - -C '$REMOTE_HELPERS'"
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo python3 -B '$REMOTE_HELPERS/staging-remote-release.py' preflight --root '$STAGING_APP_DIR' --image-sha '$SHA' $BOOTSTRAP_ARG" > "$RUNNER_TEMP/accepted-before.json"
          node - "$RUNNER_TEMP/accepted-before.json" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `previous_sha=${data.release?.imageSha ?? ''}\nasset_sha=${data.binding?.assetSha ?? ''}\n`);
          NODE

      - name: Sync workspace to deploy SHA
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: git fetch --no-tags --depth=1 origin "$SHA" && git checkout --detach FETCH_HEAD
      - name: Checkout pinned private assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_SCENE_ASSETS_REPOSITORY }}
          ref: ${{ steps.previous.outputs.asset_sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_SCENE_ASSETS_DEPLOY_KEY }}
          path: private-scene-assets
          persist-credentials: false
      - name: Freeze asset SHA
        run: echo "ASSET_SHA=$(git -C private-scene-assets rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile

      - name: Detect remote browser changes
        id: remote_browser_impact
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
        run: |
          if [ -z "$PREVIOUS_SHA" ]; then BLOCKING=true; else
            git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
            if git diff --quiet "$PREVIOUS_SHA" "$SHA" -- .github/workflows/staging-deploy.yml .github/workflows/rutube-canary.yml apps/api apps/remote-browser apps/room-state apps/runtime-web/src/main.ts apps/runtime-web/src/media apps/runtime-web/public/remote-browser-demo.html apps/runtime-web/public/remote-browser-media-demo.html apps/shared-types infra/docker package.json pnpm-lock.yaml playwright.config.ts tests/e2e/m1-media tools/run-staging-e2e.mjs; then BLOCKING=false; else BLOCKING=true; fi
          fi
          echo "rutube_blocking=$BLOCKING" >> "$GITHUB_OUTPUT"

      - name: Upload candidate source without replacing accepted files
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: |
          test -f private-scene-assets/assets/manifest.json
          echo "REMOTE_SOURCE=${STAGING_APP_DIR}-stage-state/source/$SHA/$ASSET_SHA" >> "$GITHUB_ENV"
          # shellcheck disable=SC2029
          tar -C private-scene-assets/assets -czf - . | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo mkdir -p '${STAGING_APP_DIR}-stage-state/source/$SHA/$ASSET_SHA' && sudo tar -xzf - -C '${STAGING_APP_DIR}-stage-state/source/$SHA/$ASSET_SHA'"
      - name: Capture pre-rollout scene URLs
        if: steps.previous.outputs.previous_sha != ''
        timeout-minutes: 5
        run: |
          node "$RUNNER_TEMP/vrata-scene-rollback/staging-scene-snapshot.mjs" capture "$RUNNER_TEMP/vrata-scene-bundle-snapshot.json"
          # Keep the private pointer snapshot available for recovery after runner cancellation.
          # shellcheck disable=SC2029
          cat "$RUNNER_TEMP/vrata-scene-bundle-snapshot.json" | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo install -d -m 700 '${STAGING_APP_DIR}-stage-state/attempts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT' && sudo sh -c 'umask 077; cat > \"${STAGING_APP_DIR}-stage-state/attempts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scene-urls.json\"'"

      - name: Roll out staging images
        id: rollout
        timeout-minutes: 25
        continue-on-error: true
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$YCR_PASSWORD" | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo docker login cr.yandex --username '$YCR_USERNAME' --password-stdin"
          BOOTSTRAP_ARG=; if [ "$BOOTSTRAP" = true ]; then BOOTSTRAP_ARG=--bootstrap; fi
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo python3 -B '$REMOTE_HELPERS/staging-remote-release.py' rollout --root '$STAGING_APP_DIR' --image-sha '$SHA' --asset-sha '$ASSET_SHA' --source '$REMOTE_SOURCE' --run-id '$GITHUB_RUN_ID' --run-attempt '$GITHUB_RUN_ATTEMPT' $BOOTSTRAP_ARG"

      - name: Public health and authenticated seed
        if: steps.rollout.outcome == 'success'
        timeout-minutes: 8
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 10 "$BASE_URL/health" >/dev/null; then break; fi
            sleep 5
            echo "waiting_for_public_health:$attempt"
          done
          curl --fail --silent --max-time 30 "$BASE_URL/health" >/dev/null
          node tools/bootstrap-staging-rooms.mjs
          node --input-type=module - <<'NODE'
          const data = await (await fetch(`${process.env.BASE_URL}/api/templates`, {headers:{'x-vrata-admin-token':process.env.STAGING_ADMIN_TOKEN}})).json();
          if (data.items.some(row => row.templateId === 'meeting-room-basic' && row.currentVersion === '0.1.0')) {
            const {seedStagingTemplateFixtures} = await import('./tools/seed-staging-template-fixtures.mjs');
            await seedStagingTemplateFixtures(process.env.BASE_URL, process.env.STAGING_ADMIN_TOKEN);
          }
          NODE
      - name: Patch canonical staging scene bundles
        if: steps.rollout.outcome == 'success'
        timeout-minutes: 5
        env:
          STAGING_SCENE_BUNDLE_PATCH_REPORT: /tmp/vrata-scene-bundle-patch-report.json
        run: node tools/patch-staging-scene-bundles.mjs
      - name: Install Playwright browser
        if: steps.rollout.outcome == 'success'
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Verification gate
        id: gate
        timeout-minutes: 35
        if: steps.rollout.outcome == 'success'
        continue-on-error: true
        env:
          RUTUBE_BLOCKING: ${{ steps.remote_browser_impact.outputs.rutube_blocking }}
          FORCE_FAIL: ${{ inputs.force_fail_gate || false }}
          PLAYWRIGHT_REPORT_NAME: staging-gate
        run: |
          curl --fail --silent "$BASE_URL/rooms/demo-room" >/dev/null
          curl --fail --silent "$BASE_URL/control-plane" >/dev/null
          if [ "$FORCE_FAIL" = true ]; then echo forced_gate_failure >&2; exit 1; fi
          pnpm test:e2e:staging
          if [ "$RUTUBE_BLOCKING" = true ]; then PLAYWRIGHT_REPORT_NAME=staging-rutube-blocking pnpm test:e2e:rutube; fi

      - name: Publish accepted release and finalize catalog
        id: publish
        timeout-minutes: 5
        if: steps.gate.outcome == 'success'
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: |
          node - <<'NODE' > "$RUNNER_TEMP/gate-proof.json"
          console.log(JSON.stringify({schemaVersion:1,imageSha:process.env.SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),gate:'passed'}));
          NODE
          # shellcheck disable=SC2029
          cat "$RUNNER_TEMP/gate-proof.json" | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo tee '$REMOTE_HELPERS/gate-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json' >/dev/null"
          BOOTSTRAP_ARG=; if [ "$BOOTSTRAP" = true ]; then BOOTSTRAP_ARG=--bootstrap; fi
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo python3 -B '$REMOTE_HELPERS/staging-remote-release.py' publish --root '$STAGING_APP_DIR' --image-sha '$SHA' --asset-sha '$ASSET_SHA' --gate-proof '$REMOTE_HELPERS/gate-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json' --run-id '$GITHUB_RUN_ID' --run-attempt '$GITHUB_RUN_ATTEMPT' $BOOTSTRAP_ARG"

      - name: Remove obsolete scene copies after acceptance
        if: steps.publish.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: |
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo python3 -B '$REMOTE_HELPERS/staging-remote-release.py' prune --root '$STAGING_APP_DIR' --image-sha '$SHA'"

      - name: Roll back failed deploy
        id: rollback
        timeout-minutes: 20
        if: ${{ !cancelled() && (steps.rollout.outcome == 'success' || steps.rollout.outcome == 'failure') && (failure() || steps.rollout.outcome == 'failure' || steps.gate.outcome == 'failure') }}
        env:
          SHA: ${{ steps.deploy.outputs.deploy_sha }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$YCR_PASSWORD" | ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo docker login cr.yandex --username '$YCR_USERNAME' --password-stdin"
          # shellcheck disable=SC2029
          ssh "$STAGING_SSH_USER@$STAGING_SSH_HOST" "sudo python3 -B '$REMOTE_HELPERS/staging-remote-release.py' rollback --root '$STAGING_APP_DIR' --image-sha '$SHA' --run-id '$GITHUB_RUN_ID' --run-attempt '$GITHUB_RUN_ATTEMPT'" > "$RUNNER_TEMP/rollback-result.json"
          if [ -n '${{ steps.previous.outputs.previous_sha }}' ]; then
            node "$RUNNER_TEMP/vrata-scene-rollback/staging-scene-snapshot.mjs" restore "$RUNNER_TEMP/vrata-scene-bundle-snapshot.json"
            curl --fail --silent "$BASE_URL/health" >/dev/null
            curl --fail --silent "$BASE_URL/rooms/demo-room" >/dev/null
            curl --fail --silent "$BASE_URL/control-plane" >/dev/null
          fi
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
      - name: Fail after rollback
        if: ${{ !cancelled() && (steps.rollback.outcome == 'success' || steps.rollback.outcome == 'failure') }}
        run: exit 1

  rutube-canary:
    name: Rutube canary (no rollback)
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.rutube_blocking != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: rutube-canary
      cancel-in-progress: false
    env:
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      PLAYWRIGHT_NO_WEB_SERVER: "1"
      PLAYWRIGHT_REPORT_NAME: staging-rutube-canary
      STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
      STAGING_BLUEOFFICE_ROOM_ID: 0b537d34-7b92-4b51-854a-8c64cfb4c114
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.deploy_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:rutube:canary
      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rutube-canary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            playwright-report/staging-rutube-canary/
            test-results/staging-rutube-canary/
            test-results/staging-rutube-canary.json
