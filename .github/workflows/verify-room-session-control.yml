name: Verify deployed room session control extraction
on:
  push:
    branches: [verification/api-room-session-control-20260913]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXPECTED_SHA: 2bcf303da9797d6f1acb35fbd2e267ed0a016e1f
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
    steps:
      - name: Load existing staging SSH identity
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
          log-public-key: false
      - name: Check running SHA and execute isolated rules tests
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          command="$(printf 'sudo -n bash -s -- %q %q' "$EXPECTED_SHA" "$STAGING_APP_DIR")"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" "$command" <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHA="$1"
          APP_DIR="$2"
          cd "$APP_DIR"
          test "$(git -c safe.directory="$APP_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat infra/docker/.staging-successful-image-tag)" = "$EXPECTED_SHA"
          echo "successful_staging_sha_verified:$EXPECTED_SHA"
          for service in api room-state remote-browser; do
            id="$(docker compose --env-file infra/docker/.env.staging -f infra/docker/compose.staging.yml ps -q "$service")"
            test -n "$id"
            image="$(docker inspect --format '{{.Config.Image}}' "$id")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
            case "$image" in *":$EXPECTED_SHA") ;; *) echo "wrong_image:$service:$image"; exit 1;; esac
            test "$health" = healthy
            echo "running_image_verified:$service:$image:$health"
            if [ "$service" = api ]; then API_CONTAINER="$id"; fi
          done
          # Separate Node process: pure rule tests do not access storage or change rooms.
          docker exec -w /app "$API_CONTAINER" node --test apps/api/dist/room-session-control.test.js
          REMOTE
      - name: Check public HTTPS endpoints without logging bodies
        shell: bash
        run: |
          for path in /health /rooms/demo-room /control-plane; do
            code="$(curl --silent --show-error --fail --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "${BASE_URL%/}$path")"
            test "$code" = 200
            echo "http_check:$path:$code"
          done
