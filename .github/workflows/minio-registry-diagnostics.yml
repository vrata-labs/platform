name: MinIO registry diagnostics
on:
  push:
    branches: [diagnostics/minio-registry-20260912]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: |
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/platform-source.tgz"
          find . -name AGENTS.md -not -path './.git/*' -print
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minio-fix-source
          path: ${{ runner.temp }}/platform-source.tgz
          retention-days: 3
      - name: Inspect official registry manifests without pulling or running images
        run: |
          set -euo pipefail
          for image in minio/minio:RELEASE.2025-02-28T09-55-16Z minio/mc:RELEASE.2025-03-12T17-29-24Z quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z; do
            echo "registry_probe:$image"
            if timeout 40 docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/manifest.json"; then
              sha256sum "$RUNNER_TEMP/manifest.json"
              jq -c '{mediaType, config, manifests: [.manifests[]? | {digest,platform}]}' "$RUNNER_TEMP/manifest.json"
              digest="$(jq -r '.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' "$RUNNER_TEMP/manifest.json" | head -1)"
              if [ -n "$digest" ]; then
                timeout 40 docker buildx imagetools inspect --raw "${image%:*}@$digest" | jq -c '{mediaType,config,layers}'
              fi
            else
              echo "registry_probe_failed:$image"
            fi
          done
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
          log-public-key: false
      - name: Read running image IDs and test official manifests from staging
        env:
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n docker ps --format 'container:{{.Names}} image:{{.Image}} status:{{.Status}}'
          for image in minio/minio:RELEASE.2025-02-28T09-55-16Z minio/mc:RELEASE.2025-03-12T17-29-24Z; do
            sudo -n docker image inspect --format 'image_id:{{.Id}} repo_digests:{{json .RepoDigests}}' "$image" || true
          done
          for image in quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z; do
            echo "staging_registry_probe:$image"
            if timeout 45 sudo -n docker manifest inspect "$image" >/dev/null; then
              echo "staging_registry_available:$image"
            else
              echo "staging_registry_unavailable:$image"
            fi
          done
          REMOTE
