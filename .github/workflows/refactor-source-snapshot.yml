name: Refactor source snapshot
on:
  push:
    branches: [preparation/storage-decomposition-20260920]
    paths: [.github/workflows/refactor-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dcd6bdd49280a57a819bc30ff0aac171644097ec
          persist-credentials: false
      - name: Export tracked source and Git metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dcd6bdd49280a57a819bc30ff0aac171644097ec
          mkdir -p "$RUNNER_TEMP/refactor-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/refactor-source/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/refactor-source/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/refactor-source/identity.txt"
          sha256sum "$RUNNER_TEMP/refactor-source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refactor-baseline-dcd6bdd
          path: ${{ runner.temp }}/refactor-source/
          if-no-files-found: error
          retention-days: 7
