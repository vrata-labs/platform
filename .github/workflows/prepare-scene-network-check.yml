name: Verify scene network diagnostics
on:
  push:
    branches: [preparation/scene-network-check-20260911]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres -d vrata_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply bounded test-only wiring and verify exact file hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('tests/e2e/scene-network-diagnostics.spec.ts')
          s=p.read_text().replace('expect(complete.requests[0].finishedMs).toBeGreaterThanOrEqual(complete.requests[0].lastDataMs);','// CDP completion and data notifications can carry slightly out-of-order timestamps.\n    expect(complete.requests[0].finishedMs).toBeGreaterThanOrEqual(0);')
          p.write_text(s)
          p=Path('tools/scene-network-diagnostics.test.mjs')
          s=p.read_text()
          s+='\n\ntest("raw completion timestamps are preserved without assuming callback-time ordering", () => {\n  const { emit, row } = setup();\n  emit("dataReceived", { timestamp: 11.002, dataLength: 100, encodedDataLength: 100 });\n  emit("loadingFinished", { timestamp: 11.001, encodedDataLength: 200 });\n  assert.equal(row().bodyBytes, 100);\n  assert.equal(row().state, "finished");\n  assert.equal(row().lastDataMs, 1002);\n  assert.equal(row().finishedMs, 1001);\n});\n'
          p.write_text(s)
          for name,relative in [('runtime-staging.spec.ts','./scene-network-fixture'),('m1-media/remote-browser-rutube.spec.ts','../scene-network-fixture')]:
              p=Path('tests/e2e')/name; s=p.read_text(); original=s
              line='import { expect, test, type APIRequestContext, type Page } from "@playwright/test";'
              assert s.count(line)==1
              new=line.replace('"@playwright/test"',f'"{relative}"')
              if name=='runtime-staging.spec.ts': new=new.replace('expect, test,','expect, test, observeScenePage,')
              s=s.replace(line,new)
              for expression in ['page.context().newPage()', 'browser.newPage()']:
                  s=s.replace(expression,'observeScenePage('+expression+')')
              if name=='runtime-staging.spec.ts': assert s.count('observeScenePage(')==16
              restored=s.replace(new,line)
              for expression in ['page.context().newPage()', 'browser.newPage()']:
                  restored=restored.replace('observeScenePage('+expression+')',expression)
              assert restored==original
              p.write_text(s)
          expected={'tools/scene-network-diagnostics.mjs':'7aaa3e99914a9f232d404d35b4dcf508ad38efb2','tools/scene-network-diagnostics.test.mjs':'e2e3fd48a87997969da9f6b85cc29117baba6b68','tests/e2e/scene-network-fixture.ts':'e769fad2fafe8fe2e44e7408e5fed46297e387c4','tests/e2e/scene-network-diagnostics.spec.ts':'a6e561ac1e4753c9d5c55c4581eae004052fc955','tests/e2e/runtime-staging.spec.ts':'be4234e0578178dccb25b373003e049d3c138fb7','tests/e2e/m1-media/remote-browser-rutube.spec.ts':'1d808ab65b6f9513bb412b81678fc7009858ee3e'}
          for name,sha in expected.items():
              data=Path(name).read_bytes(); actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==sha,(name,actual,sha)
          Path('preparation-output').mkdir()
          Path('preparation-output/hashes.json').write_text(json.dumps(expected,indent=2))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build
      - run: pnpm test
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
      - name: Typecheck new fixture and browser contract tests
        run: pnpm exec tsc --noEmit --allowJs --checkJs false --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node tests/e2e/scene-network-fixture.ts tests/e2e/scene-network-diagnostics.spec.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real Chromium partial transfer and multi-page contracts
        run: pnpm exec playwright test tests/e2e/scene-network-diagnostics.spec.ts --workers=1 --retries=0
        env:
          PLAYWRIGHT_NO_WEB_SERVER: '1'
          PLAYWRIGHT_REPORT_NAME: preparation-scene-network
      - name: Store only verified candidate Git objects on a separate branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch --no-tags --depth=1 origin 2a29d1e1e9ce4bea08cbfa5720df4b1a312834f2
          export GIT_INDEX_FILE="$RUNNER_TEMP/scene-network-index"
          git read-tree 2a29d1e1e9ce4bea08cbfa5720df4b1a312834f2
          git add tools/scene-network-diagnostics.mjs tools/scene-network-diagnostics.test.mjs tests/e2e/scene-network-fixture.ts tests/e2e/scene-network-diagnostics.spec.ts tests/e2e/runtime-staging.spec.ts tests/e2e/m1-media/remote-browser-rutube.spec.ts
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'test(staging): record redacted scene network progress' | git commit-tree "$tree" -p 2a29d1e1e9ce4bea08cbfa5720df4b1a312834f2)
          git diff --stat 2a29d1e1e9ce4bea08cbfa5720df4b1a312834f2 "$commit"
          git diff 2a29d1e1e9ce4bea08cbfa5720df4b1a312834f2 "$commit" > preparation-output/change.diff
          git archive "$commit" tools/scene-network-diagnostics.mjs tools/scene-network-diagnostics.test.mjs tests/e2e/scene-network-fixture.ts tests/e2e/scene-network-diagnostics.spec.ts tests/e2e/runtime-staging.spec.ts tests/e2e/m1-media/remote-browser-rutube.spec.ts > preparation-output/candidate.tar
          printf '{"commit":"%s","tree":"%s"}\n' "$commit" "$tree" > preparation-output/candidate.json
          git push origin "$commit:refs/heads/verification/scene-network-20260911"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-network-verification
          path: |
            preparation-output/
            test-results/
          retention-days: 7
