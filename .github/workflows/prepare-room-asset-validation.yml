name: Prepare room asset validation refactor

on:
  push:
    branches: [preparation/room-asset-validation-20260914]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5f64ef9f4352923853d6be5b9b00e6f6a25b760
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/room-asset-verification"
          pnpm build | tee "$RUNNER_TEMP/room-asset-verification/baseline-build.log"
          cp -R apps/api/dist "$RUNNER_TEMP/room-assets-before"
      - name: Apply verified patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''
          # The payload below is the complete locally verified patch.
          encoded = encoded[:0] + ''
          raise RuntimeError('publication_payload_not_verified')
          PY
