name: Prepare room asset validation refactor

on:
  push:
    branches: [preparation/room-asset-validation-20260914]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5f64ef9f4352923853d6be5b9b00e6f6a25b760
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/room-asset-verification"
          pnpm build | tee "$RUNNER_TEMP/room-asset-verification/baseline-build.log"
          cp -R apps/api/dist "$RUNNER_TEMP/room-assets-before"
      - name: Apply verified extraction and tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/vrata-labs/platform/git/blobs/6d97917788d87d0d7178de6fca711acb48b8889b --jq .content | base64 --decode > apps/api/src/room-asset-validation.test.ts
          test "$(git hash-object apps/api/src/room-asset-validation.test.ts)" = 6d97917788d87d0d7178de6fca711acb48b8889b
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/index.ts')
          s = p.read_text()
          start = s.index('async function validateRoomAssetIds(')
          end = s.index('function validateSceneBundleInput(', start)
          block = s[start:end]
          assert block.count('function ') == 2
          header = 'import type { AssetRecord, Storage } from "./storage-contracts.js";\n\n'
          module = header + block.replace('async function validateRoomAssetIds(', 'export async function validateRoomAssetIds(', 1).replace('  storage: Awaited<typeof storagePromise>,', '  storage: Storage,', 1).replace('function validateAssetInput(', 'export function validateAssetInput(', 1)
          new = s[:start] + s[end:]
          anchor = 'import { createXrTelemetryService } from "./xr-telemetry-service.js";'
          assert new.count(anchor) == 1
          new = new.replace(anchor, 'import { validateRoomAssetIds, validateAssetInput } from "./room-asset-validation.js";\n\n' + anchor, 1)
          p.write_text(new)
          Path('apps/api/src/room-asset-validation.ts').write_text(module.rstrip() + '\n')
          PY
          git add -- apps/api/src/index.ts apps/api/src/room-asset-validation.ts apps/api/src/room-asset-validation.test.ts
          test "$(git write-tree)" = 487e5b10ed737ebaffa9be2372656875cdf93af4
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/room-asset-verification/refactor.patch"
      - name: Lint and typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint | tee "$RUNNER_TEMP/room-asset-verification/lint.log"
          pnpm typecheck | tee "$RUNNER_TEMP/room-asset-verification/typecheck.log"
      - name: Build candidate and compare executable declarations
        shell: bash
        run: |
          set -euo pipefail
          pnpm build | tee "$RUNNER_TEMP/room-asset-verification/candidate-build.log"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          const oldDir = path.join(process.env.RUNNER_TEMP, 'room-assets-before');
          const out = path.join(process.env.RUNNER_TEMP, 'room-asset-verification');
          const parse = text => ts.createSourceFile('file.js', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.JS);
          const before = parse(fs.readFileSync(path.join(oldDir, 'index.js'), 'utf8'));
          const after = parse(fs.readFileSync('apps/api/dist/index.js', 'utf8'));
          const mod = parse(fs.readFileSync('apps/api/dist/room-asset-validation.js', 'utf8'));
          const names = new Set(['validateRoomAssetIds', 'validateAssetInput']);
          const moved = s => ts.isFunctionDeclaration(s) && names.has(s.name?.text);
          const addedImport = s => ts.isImportDeclaration(s) && s.moduleSpecifier.text === './room-asset-validation.js';
          const original = before.statements.filter(moved);
          assert.equal(original.length, 2);
          for (const fn of original) {
            const extracted = mod.statements.find(s => moved(s) && s.name.text === fn.name.text);
            assert.ok(extracted);
            assert.equal(extracted.getText(mod).replace(/^export /, ''), fn.getText(before));
          }
          assert.deepEqual(after.statements.filter(s => !addedImport(s)).map(s => s.getText(after)), before.statements.filter(s => !moved(s)).map(s => s.getText(before)));
          assert.equal(mod.statements.filter(ts.isImportDeclaration).length, 0);
          const files = fs.readdirSync(oldDir, { recursive: true }).filter(name => name.endsWith('.js')).sort();
          for (const name of files.filter(name => name !== 'index.js')) {
            assert.deepEqual(fs.readFileSync(path.join(oldDir, name)), fs.readFileSync(path.join('apps/api/dist', name)), name);
          }
          assert.deepEqual(fs.readFileSync(path.join(oldDir, 'index.d.ts')), fs.readFileSync('apps/api/dist/index.d.ts'));
          const report = { compiler: ts.version, existingJavaScriptFiles: files.length, byteIdenticalJavaScriptFiles: files.length - 1, movedFunctionsIdentical: true, remainingDeclarationsIdentical: true, publicIndexDeclarationIdentical: true, newModuleRuntimeImports: 0 };
          fs.writeFileSync(path.join(out, 'compiled-equivalence.json'), JSON.stringify(report, null, 2));
          console.log(report);
          const checkDir = path.join(process.env.RUNNER_TEMP, 'room-assets-baseline-check');
          fs.mkdirSync(checkDir, { recursive: true });
          fs.writeFileSync(path.join(checkDir, 'package.json'), '{"type":"module"}');
          fs.writeFileSync(path.join(checkDir, 'room-asset-validation.js'), original.map(fn => 'export ' + fn.getText(before)).join('\n\n'));
          fs.copyFileSync('apps/api/dist/room-asset-validation.test.js', path.join(checkDir, 'room-asset-validation.test.js'));
          JS
          node --test "$RUNNER_TEMP/room-assets-baseline-check/room-asset-validation.test.js" | tee "$RUNNER_TEMP/room-asset-verification/baseline-tests.log"
      - name: Test workspace with PostgreSQL
        shell: bash
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        run: |
          set -euo pipefail
          pnpm test | tee "$RUNNER_TEMP/room-asset-verification/workspace-tests.log"
      - name: Commit and push only the verified source tree
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f5f64ef9f4352923853d6be5b9b00e6f6a25b760
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = f5f64ef9f4352923853d6be5b9b00e6f6a25b760
          test -z "$(git ls-remote origin refs/heads/refactor/room-asset-validation-20260914)"
          test "$(git write-tree)" = 487e5b10ed737ebaffa9be2372656875cdf93af4
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(api): isolate room asset validation'
          git push origin HEAD:refs/heads/refactor/room-asset-validation-20260914
          git rev-parse HEAD > "$RUNNER_TEMP/room-asset-verification/candidate-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/room-asset-verification/candidate-tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/room-asset-verification/candidate-source.tgz"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-asset-validation-candidate
          path: ${{ runner.temp }}/room-asset-verification
          retention-days: 14
          if-no-files-found: error
