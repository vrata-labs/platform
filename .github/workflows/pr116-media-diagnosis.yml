name: PR116 media diagnosis
on:
  push:
    branches: ['diagnostics/pr116-screen-share-20260924']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
      VRATA_REFERENCE_CATALOG_ACTIVE: '1'
      PLAYWRIGHT_NO_WEB_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac409291c10b5694a3cb98ee823f2e188b377219
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact published test and build unchanged product
        run: |
          test "$(git rev-parse HEAD)" = ac409291c10b5694a3cb98ee823f2e188b377219
          test "$(git hash-object tests/e2e/reference-template-scenarios.ts)" = 594918eeae9abac6b514715915e5249d498f9bef
          git diff --exit-code HEAD -- apps
          pnpm build
          sha256sum apps/runtime-web/dist/assets/main-*.js
      - name: Point only the two experiment browsers to the built client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/reference-template-scenarios.ts')
          s = p.read_text()
          s = 'import { readFileSync, readdirSync } from "node:fs";\n' + s
          start = s.index('if (staging) test("reference presentation receives moving screen-share')
          end = s.index('if (!staging) test(', start)
          block = s[start:end]
          old = '  const observer = await browser.newPage({ viewport, deviceScaleFactor });'
          assert block.count(old) == 1
          block = block.replace(old, old + '''
            const dir = "apps/runtime-web/dist/assets";
            const files = readdirSync(dir).filter(n => /^main-.*\\.js$/.test(n));
            if (files.length !== 1) throw new Error("ambiguous_main");
            const body = readFileSync(`${dir}/${files[0]}`);
            for (const client of [page, observer]) {
              let hits = 0;
              await client.route(/\\/assets\\/main-[^/]+\\.js$/, async route => {
                if (++hits !== 1) throw new Error("unexpected_main_reload");
                console.log("candidate_main_intercepted");
                await route.fulfill({ status: 200, contentType: "text/javascript", body });
              });
            }
          ''')
          p.write_text(s[:start] + block + s[end:])
          PY
      - run: pnpm exec playwright install --with-deps chromium
      - name: Three independent checks, no retries or changed assertions (not deployment verification)
        run: |
          result=0
          for n in 1 2 3; do
            export PLAYWRIGHT_REPORT_NAME="pr118-repeat-$n"
            if pnpm exec playwright test tests/e2e/reference-templates-staging.spec.ts --grep 'reference presentation receives moving screen-share' --workers=1; then
              echo "RESULT:$n:passed"
            else
              echo "RESULT:$n:failed"
              result=1
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr118-repeat-verification-${{ github.run_id }}
          path: |
            test-results/*.json
            playwright-report/
          retention-days: 7
