name: Prepare storage init retry extraction
on:
  push:
    branches: [preparation/storage-init-retry-20260914]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrata_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vrata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASE_SHA: 5f9be9aa32cc940aaaa4c1bd20c4a81e6722ec36
      EXPECTED_TREE: 9a947f2254a6df94b0ff93d0b6a9b39280d4a50f
      CANDIDATE_BRANCH: refactor/storage-init-retry-20260914
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f9be9aa32cc940aaaa4c1bd20c4a81e6722ec36
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry-evidence"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/retry-evidence/baseline-build.log"
          cp -a apps/api/dist "$RUNNER_TEMP/retry-baseline-dist"
          cp apps/api/src/storage.ts "$RUNNER_TEMP/retry-baseline-storage.ts"
      - name: Apply exact reviewed extraction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/vrata-labs/platform/git/blobs/b01c02e6daa0bdc393647f203f82b05ca1796c1d > "$RUNNER_TEMP/retry-test-blob.json"
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os
          path = Path('apps/api/src/storage.ts')
          original = path.read_text()
          def blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob_sha(original.encode()) == 'f451f5ea4a28dabe27fdabd4554741152e0c770c'
          constants = original[original.index('const POSTGRES_INIT_MAX_ATTEMPTS'):original.index('const POSTGRES_INIT_ADVISORY_LOCK_SQL')]
          block = original[original.index('type InitializableStorage'):original.index('function normalizePostgresDefinition')]
          module = constants+'\n'+block.rstrip()+'\n'
          import_line = 'import { initPostgresStorageWithRetry } from "./storage-init-retry.js";\n'
          export_line = 'export { initPostgresStorageWithRetry } from "./storage-init-retry.js";\n\n'
          candidate = import_line+original.replace(constants,'',1).replace(block,'',1)
          pos = candidate.index('export type {')
          candidate = candidate[:pos]+export_line+candidate[pos:]
          inverse = candidate.replace(import_line,'',1).replace(export_line,'',1)
          inverse = inverse.replace('const POSTGRES_INIT_ADVISORY_LOCK_SQL',constants+'const POSTGRES_INIT_ADVISORY_LOCK_SQL',1)
          inverse = inverse.replace('function normalizePostgresDefinition',block+'function normalizePostgresDefinition',1)
          assert inverse == original
          assert blob_sha(candidate.encode()) == 'b9a3957cba9e30b889ba0e4aea0388e9b30ba954'
          blob = json.loads(Path(os.environ['RUNNER_TEMP'],'retry-test-blob.json').read_text())
          assert blob['encoding'] == 'base64'
          tests = base64.b64decode(blob['content'])
          assert blob_sha(tests) == 'b01c02e6daa0bdc393647f203f82b05ca1796c1d'
          path.write_text(candidate)
          Path('apps/api/src/storage-init-retry.ts').write_text(module)
          Path('apps/api/src/storage-init-retry.test.ts').write_bytes(tests)
          report = {'inverse_equal':True,'storage_before':len(original.splitlines()),'storage_after':len(candidate.splitlines()),'module_lines':len(module.splitlines()),'test_lines':len(tests.splitlines())}
          Path(os.environ['RUNNER_TEMP'],'retry-evidence/source-equivalence.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck
      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/retry-evidence/candidate-build.log"
      - name: Compare compiled implementations and public export
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          const ts = createRequire(path.join(process.cwd(),'package.json'))('typescript');
          const baseline = path.join(process.env.RUNNER_TEMP,'retry-baseline-dist');
          const current = 'apps/api/dist';
          const names = fs.readdirSync(baseline).filter(n=>n.endsWith('.js'));
          const unchanged = names.filter(n=>n!=='storage.js');
          for (const name of unchanged) assert.deepEqual(fs.readFileSync(path.join(current,name)),fs.readFileSync(path.join(baseline,name)),name);
          const additions = fs.readdirSync(current).filter(n=>n.endsWith('.js')&&!names.includes(n)).sort();
          assert.deepEqual(additions,['storage-init-retry.js','storage-init-retry.test.js']);
          const parse = file => ts.createSourceFile(file,fs.readFileSync(file,'utf8'),ts.ScriptTarget.Latest,true);
          const old = parse(path.join(baseline,'storage.js'));
          const now = parse(path.join(current,'storage.js'));
          const extracted = parse(path.join(current,'storage-init-retry.js'));
          const name = s => s.name?.text ?? s.declarationList?.declarations[0]?.name?.text;
          const moved = new Set(['POSTGRES_INIT_MAX_ATTEMPTS','POSTGRES_INIT_RETRY_DELAY_MS','RETRYABLE_POSTGRES_INIT_ERROR_CODES','delay','getErrorCode','isRetryablePostgresInitError','initPostgresStorageWithRetry']);
          const substantive = s => !ts.isImportDeclaration(s)&&!ts.isExportDeclaration(s);
          assert.deepEqual(old.statements.filter(s=>moved.has(name(s))).map(s=>s.getText(old)),extracted.statements.filter(substantive).map(s=>s.getText(extracted)));
          assert.deepEqual(old.statements.filter(s=>substantive(s)&&!moved.has(name(s))).map(s=>s.getText(old)),now.statements.filter(substantive).map(s=>s.getText(now)));
          assert.equal(extracted.statements.filter(ts.isImportDeclaration).length,0);
          const storage = await import(path.resolve(current,'storage.js'));
          const retry = await import(path.resolve(current,'storage-init-retry.js'));
          assert.equal(storage.initPostgresStorageWithRetry,retry.initPostgresStorageWithRetry);
          assert.deepEqual(Object.keys(storage).sort(),['MemoryStorage','PostgresStorage','createStorage','initPostgresStorageWithRetry'].sort());
          const report = {typescript:ts.version,existing_js_files:names.length,unchanged_js_files:unchanged.length,moved_js_declarations:moved.size,all_remaining_declarations_equal:true,public_export_identity:true,additions};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'retry-evidence/compiled-equivalence.json'),JSON.stringify(report,null,2));
          console.log(report);
          JS
      - name: Test including PostgreSQL
        env:
          VRATA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/vrata_test
        shell: bash
        run: |
          set -euo pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/retry-evidence/workspace-tests.log"
      - name: Publish only the reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git add apps/api/src/storage.ts apps/api/src/storage-init-retry.ts apps/api/src/storage-init-retry.test.ts
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/retry-evidence/refactor.patch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(api): isolate PostgreSQL initialization retry policy'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/retry-evidence/candidate-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/retry-evidence/candidate-tree.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/retry-evidence/candidate-source.tgz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-init-retry-candidate
          retention-days: 14
          path: ${{ runner.temp }}/retry-evidence/
